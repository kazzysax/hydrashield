[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrashield"
version = "0.1.0"
description = "Graph-native software supply-chain blast-radius analysis on HydraDB"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

